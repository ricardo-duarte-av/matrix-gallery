<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix Room Gallery</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --accent: #7c3aed;
    --text: #e5e5e5;
    --muted: #6b7280;
    --col-width: 240px;
    --gap: 3px;
  }

  html, body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* ── Header ── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13,13,13,.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #222;
  }
  header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: .02em; }
  #status {
    margin-left: auto;
    font-size: .8rem;
    color: var(--muted);
    min-width: 5ch;
    text-align: right;
  }

  /* ── Masonry gallery ── */
  #gallery {
    position: relative;
    /* height is set by JS masonry engine */
  }

  .media-card {
    position: absolute;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    cursor: pointer;
    border-radius: 4px;
    overflow: hidden;
    transition: transform .2s ease;
    /* width is set by JS masonry engine */
  }
  .media-card:hover {
    transform: translateY(-2px);
    background: #222;
  }

  .media-thumb-wrap {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: #000;
    /* no fixed height — images drive the height */
  }

  .media-thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .25s ease, opacity .3s;
    opacity: 0;
  }
  .media-thumb-wrap img.loaded { opacity: 1; }
  .media-card:hover .media-thumb-wrap img { transform: scale(1.06); }

  /* Video badge */
  .video-badge {
    position: absolute;
    bottom: 6px;
    right: 6px;
    background: rgba(0,0,0,.65);
    border-radius: 4px;
    padding: 2px 6px;
    font-size: .7rem;
    color: #fff;
    pointer-events: none;
    backdrop-filter: blur(4px);
  }

  /* Placeholder for items with no thumbnail */
  .media-placeholder {
    width: 100%;
    height: 160px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--muted);
    font-size: .8rem;
  }
  .media-placeholder svg { width: 40px; height: 40px; }

  .media-info {
    padding: 6px 8px;
    border-top: 1px solid #222;
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }

  .sender-avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    background: #2a2a2a;
  }
  .sender-avatar-placeholder {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: .65rem;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
    text-transform: uppercase;
  }

  .media-text {
    display: flex;
    flex-direction: column;
    min-width: 0;
    gap: 1px;
  }
  .media-sender-name {
    font-size: .72rem;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .media-date {
    font-size: .65rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .media-reactions {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 4px 8px 6px;
  }
  .reaction-pill {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: rgba(124,58,237,.18);
    border: 1px solid rgba(124,58,237,.35);
    border-radius: 12px;
    padding: 1px 7px;
    font-size: .78rem;
    line-height: 1.4;
    color: var(--text);
    user-select: none;
  }
  .reaction-pill .reaction-count {
    font-size: .68rem;
    color: var(--muted);
  }

  /* ── Infinite scroll sentinel & loader ── */
  #sentinel { height: 1px; }

  #loader {
    text-align: center;
    padding: 32px 16px;
    color: var(--muted);
    font-size: .9rem;
    display: none;
  }
  #loader.visible { display: block; }

  .spinner {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid var(--muted);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Lightbox ── */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,.92);
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  #lightbox.open { display: flex; }

  #lb-media-wrap {
    position: relative;
    max-width: 92vw;
    max-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #lb-media-wrap img,
  #lb-media-wrap video {
    max-width: 92vw;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 8px 40px rgba(0,0,0,.7);
  }

  #lb-meta {
    margin-top: 10px;
    font-size: .8rem;
    color: var(--muted);
    max-width: 92vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
  }

  #lb-close {
    position: fixed;
    top: 14px;
    right: 18px;
    font-size: 1.8rem;
    line-height: 1;
    color: #fff;
    cursor: pointer;
    opacity: .7;
    background: none;
    border: none;
    padding: 4px 8px;
    border-radius: 4px;
    transition: opacity .15s;
  }
  #lb-close:hover { opacity: 1; background: rgba(255,255,255,.1); }

  #lb-prev, #lb-next {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,.08);
    border: none;
    color: #fff;
    font-size: 1.6rem;
    padding: 14px 10px;
    cursor: pointer;
    border-radius: 4px;
    transition: background .15s;
    line-height: 1;
  }
  #lb-prev { left: 10px; }
  #lb-next { right: 10px; }
  #lb-prev:hover, #lb-next:hover { background: rgba(255,255,255,.18); }
  #lb-prev:disabled, #lb-next:disabled { opacity: .2; cursor: default; }

  /* ── Empty state ── */
  #empty {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 60vh;
    color: var(--muted);
    gap: 12px;
  }
  #empty.visible { display: flex; }
  #empty svg { width: 64px; height: 64px; opacity: .4; }
</style>
</head>
<body>

<header>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
    <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
  </svg>
  <h1>Room Gallery</h1>
  <span id="status"></span>
</header>

<div id="empty">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </svg>
  <span>No media found in this room.</span>
</div>

<main id="gallery" role="list" aria-label="Media gallery"></main>

<div id="sentinel"></div>
<div id="loader"><span class="spinner"></span>Loading…</div>

<!-- Lightbox -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Media viewer">
  <button id="lb-close" aria-label="Close">×</button>
  <button id="lb-prev" aria-label="Previous">‹</button>
  <div id="lb-media-wrap">
    <div id="lb-content"></div>
  </div>
  <div id="lb-meta"></div>
  <button id="lb-next" aria-label="Next">›</button>
</div>

<script>
(() => {
  // ── State ──────────────────────────────────────────────────────────────────
  let offset = 0;
  let fetching = false;
  let exhausted = false;
  let items = [];         // all loaded MediaItem objects
  let lbIndex = -1;       // currently open lightbox index into `items`

  // ── Masonry engine ─────────────────────────────────────────────────────────
  const COL_WIDTH = 240;
  const GAP = 3;

  let mCols = 1;
  let mColH = [0];          // running height of each column
  let relayoutTimer = null;

  function masonryInit() {
    const w = gallery.clientWidth || window.innerWidth;
    mCols = Math.max(1, Math.floor((w + GAP) / (COL_WIDTH + GAP)));
    mColH = new Array(mCols).fill(0);
  }

  // Full relayout of every card already in the gallery.
  function masonryRelayout() {
    masonryInit();
    const cards = gallery.querySelectorAll('.media-card');
    cards.forEach(card => placeCard(card, false));
    syncGalleryHeight();
  }

  // Place a single card in the shortest column.
  // Pass commit=true when appending a brand-new card so we don't reset state.
  function placeCard(card, commit) {
    if (commit) {
      // Reset only when appending incrementally
    }
    const col = mColH.indexOf(Math.min(...mColH));
    card.style.left = col * (COL_WIDTH + GAP) + 'px';
    card.style.top  = mColH[col] + 'px';
    card.style.width = COL_WIDTH + 'px';
    mColH[col] += card.offsetHeight + GAP;
  }

  function syncGalleryHeight() {
    gallery.style.height = Math.max(...mColH) + 'px';
  }

  function scheduleRelayout() {
    clearTimeout(relayoutTimer);
    relayoutTimer = setTimeout(() => {
      masonryRelayout();
    }, 60);
  }

  // Append new cards to the gallery and place them into the masonry grid.
  function appendCards(newCards) {
    newCards.forEach(card => {
      card.style.width = COL_WIDTH + 'px';
      gallery.appendChild(card);
      placeCard(card, true);
    });
    syncGalleryHeight();
  }

  // ── Batch size helpers ─────────────────────────────────────────────────────
  function getCols() { return mCols; }

  function calcBatch(extraRows) {
    const rowsFit = Math.ceil(window.innerHeight / COL_WIDTH);
    return Math.min(250, mCols * (rowsFit + extraRows));
  }

  // ── DOM refs ───────────────────────────────────────────────────────────────
  const gallery   = document.getElementById('gallery');
  const loader    = document.getElementById('loader');
  const status    = document.getElementById('status');
  const empty     = document.getElementById('empty');
  const lb        = document.getElementById('lightbox');
  const lbContent = document.getElementById('lb-content');
  const lbMeta    = document.getElementById('lb-meta');
  const lbPrev    = document.getElementById('lb-prev');
  const lbNext    = document.getElementById('lb-next');

  // ── Helpers ────────────────────────────────────────────────────────────────
  const iconVideo = `<svg viewBox="0 0 24 24" fill="currentColor" width="40" height="40">
    <path d="M5 4a1 1 0 0 0-1 1v14a1 1 0 0 0 1.5.87l13-7a1 1 0 0 0 0-1.74l-13-7A1 1 0 0 0 5 4z"/>
  </svg>`;
  const iconFile = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <polyline points="14 2 14 8 20 8"/>
  </svg>`;

  function updateStatus() {
    status.textContent = items.length ? `${items.length} item${items.length === 1 ? '' : 's'}` : '';
  }

  // ── Sender helpers ─────────────────────────────────────────────────────────
  function localpart(mxid) {
    // "@user:server" → "user"
    if (!mxid) return '?';
    const colon = mxid.indexOf(':');
    return mxid.slice(1, colon > 0 ? colon : undefined) || mxid;
  }

  function makeAvatarPlaceholder(name) {
    const div = document.createElement('div');
    div.className = 'sender-avatar-placeholder';
    div.textContent = (name || '?')[0];
    return div;
  }

  // ── Render a single card ───────────────────────────────────────────────────
  function buildCard(item, globalIndex) {
    const card = document.createElement('div');
    card.className = 'media-card';
    card.setAttribute('role', 'listitem');
    card.setAttribute('tabindex', '0');
    card.title = item.filename || item.sender || '';

    const thumbWrap = document.createElement('div');
    thumbWrap.className = 'media-thumb-wrap';
    // Pre-size the thumb container from known dimensions so the masonry
    // measures the correct card height immediately, before any image loads.
    if (item.width && item.height) {
      thumbWrap.style.height = Math.round(COL_WIDTH * item.height / item.width) + 'px';
    } else {
      thumbWrap.style.height = '180px'; // sensible fallback
    }
    card.appendChild(thumbWrap);

    if (item.thumbnail_url) {
      const img = document.createElement('img');
      img.alt = item.filename || '';
      img.loading = 'lazy';
      img.onload = () => img.classList.add('loaded');
      img.onerror = () => {
        thumbWrap.innerHTML = '';
        thumbWrap.appendChild(makePlaceholder(item.type));
        scheduleRelayout();
      };
      img.src = item.thumbnail_url;
      thumbWrap.appendChild(img);
    } else {
      thumbWrap.appendChild(makePlaceholder(item.type));
    }

    if (item.type === 'video') {
      const badge = document.createElement('div');
      badge.className = 'video-badge';
      badge.textContent = '▶ video';
      thumbWrap.appendChild(badge);

      let hoverTimer = null;
      let hoverVideo = null;
      const thumb = thumbWrap.querySelector('img') || thumbWrap.querySelector('.media-placeholder');

      card.addEventListener('mouseenter', () => {
        hoverTimer = setTimeout(() => {
          hoverVideo = document.createElement('video');
          hoverVideo.muted = true;
          hoverVideo.loop = true;
          hoverVideo.playsInline = true;
          hoverVideo.poster = item.thumbnail_url;
          hoverVideo.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:4px;';
          hoverVideo.src = item.original_url;
          thumbWrap.appendChild(hoverVideo);
          hoverVideo.play().catch(() => {});
          if (thumb) thumb.style.visibility = 'hidden';
        }, 500);
      });

      card.addEventListener('mouseleave', () => {
        clearTimeout(hoverTimer);
        hoverTimer = null;
        if (hoverVideo) {
          hoverVideo.pause();
          hoverVideo.src = '';
          hoverVideo.load();
          hoverVideo.remove();
          hoverVideo = null;
          if (thumb) thumb.style.visibility = '';
        }
      });
    }

    const info = document.createElement('div');
    info.className = 'media-info';
    card.appendChild(info);

    // Avatar: real image or fallback initial
    const displayName = item.display_name || localpart(item.sender);
    if (item.sender_avatar_url) {
      const av = document.createElement('img');
      av.className = 'sender-avatar';
      av.src = item.sender_avatar_url;
      av.alt = displayName;
      av.onerror = () => { av.replaceWith(makeAvatarPlaceholder(displayName)); };
      info.appendChild(av);
    } else {
      info.appendChild(makeAvatarPlaceholder(displayName));
    }

    const textWrap = document.createElement('div');
    textWrap.className = 'media-text';
    info.appendChild(textWrap);

    const nameEl = document.createElement('div');
    nameEl.className = 'media-sender-name';
    nameEl.textContent = displayName;
    textWrap.appendChild(nameEl);

    if (item.timestamp) {
      const dt = new Date(item.timestamp);
      const dateEl = document.createElement('div');
      dateEl.className = 'media-date';
      dateEl.textContent = dt.toLocaleDateString() + ' ' + dt.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      textWrap.appendChild(dateEl);
    }

    if (item.reactions && Object.keys(item.reactions).length > 0) {
      const reactionsEl = document.createElement('div');
      reactionsEl.className = 'media-reactions';
      // Sort by count descending for consistent display
      const sorted = Object.entries(item.reactions).sort((a, b) => b[1] - a[1]);
      for (const [emoji, count] of sorted) {
        const pill = document.createElement('span');
        pill.className = 'reaction-pill';
        pill.innerHTML = `${emoji}${count > 1 ? ` <span class="reaction-count">${count}</span>` : ''}`;
        reactionsEl.appendChild(pill);
      }
      card.appendChild(reactionsEl);
    }

    const open = () => openLightbox(globalIndex);
    card.addEventListener('click', open);
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });

    return card;
  }

  function makePlaceholder(type) {
    const div = document.createElement('div');
    div.className = 'media-placeholder';
    div.innerHTML = (type === 'video' ? iconVideo : iconFile) + `<span>${type}</span>`;
    return div;
  }

  // ── Fetch & append ─────────────────────────────────────────────────────────
  async function loadMore(limit) {
    if (fetching || exhausted) return;
    fetching = true;
    loader.classList.add('visible');

    let newItems = [];
    let serverLoading = false;

    try {
      const res = await fetch(`/api/media?offset=${offset}&limit=${limit}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      newItems = data.items || [];
      serverLoading = !!data.loading;

      const newItemsFiltered = newItems.filter(ni => !items.some(i => i.event_id === ni.event_id));
      if (newItemsFiltered.length === 0 && newItems.length > 0 && !exhausted) {
        offset += newItems.length;
        setTimeout(() => loadMore(limit), 0);
        return;
      }

      const startIndex = items.length;
      items.push(...newItemsFiltered);

      const cards = newItemsFiltered.map((item, i) => buildCard(item, startIndex + i));
      appendCards(cards);

      offset += newItems.length;

      if (!data.has_more && !data.loading) {
        exhausted = true;
      }

      updateStatus();

      if (items.length === 0 && !data.has_more && !data.loading) {
        empty.classList.add('visible');
      }

      if (newItems.length === 0 && serverLoading) {
        setTimeout(() => loadMore(limit), 1200);
      }
    } catch (e) {
      console.error('Failed to load media:', e);
    } finally {
      fetching = false;
      if (exhausted) {
        loader.innerHTML = items.length ? `${items.length} items — all loaded` : '';
        loader.classList.toggle('visible', items.length === 0);
      } else {
        loader.classList.remove('visible');
      }
    }

    if (!exhausted && newItems.length > 0 &&
        sentinel.getBoundingClientRect().top <= window.innerHeight + 1000) {
      loadMore(getCols() * 4);
    }
  }

  // ── Infinite scroll via IntersectionObserver ───────────────────────────────
  const sentinel = document.getElementById('sentinel');
  const io = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) loadMore(getCols() * 4);
  }, { rootMargin: '600px' });

  // ── Window resize ──────────────────────────────────────────────────────────
  window.addEventListener('resize', scheduleRelayout);

  // ── Lightbox ───────────────────────────────────────────────────────────────
  function openLightbox(index) {
    lbIndex = index;
    renderLightbox();
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lb.classList.remove('open');
    lbContent.innerHTML = '';
    document.body.style.overflow = '';
    lbIndex = -1;
  }

  function renderLightbox() {
    const item = items[lbIndex];
    if (!item) return;

    lbContent.innerHTML = '';

    if (item.type === 'video') {
      const video = document.createElement('video');
      video.src = item.original_url;
      video.controls = true;
      video.autoplay = true;
      video.style.cssText = 'max-width:92vw;max-height:85vh;border-radius:4px;';
      lbContent.appendChild(video);
    } else {
      const img = document.createElement('img');
      img.src = item.original_url;
      img.alt = item.filename || '';
      lbContent.appendChild(img);
    }

    const parts = [item.filename, item.sender].filter(Boolean);
    lbMeta.textContent = parts.join(' · ');

    lbPrev.disabled = lbIndex <= 0;
    lbNext.disabled = lbIndex >= items.length - 1;

    if (lbIndex >= items.length - 5) loadMore(getCols() * 2);
  }

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  lbPrev.addEventListener('click', () => { if (lbIndex > 0) { lbIndex--; renderLightbox(); } });
  lbNext.addEventListener('click', () => {
    if (lbIndex < items.length - 1) { lbIndex++; renderLightbox(); }
  });

  lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });

  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') { closeLightbox(); return; }
    if (e.key === 'ArrowLeft'  && lbIndex > 0)              { lbIndex--; renderLightbox(); }
    if (e.key === 'ArrowRight' && lbIndex < items.length-1) { lbIndex++; renderLightbox(); }
  });

  // ── Kick off ───────────────────────────────────────────────────────────────
  (async () => {
    masonryInit();
    await loadMore(calcBatch(3));
    io.observe(sentinel);
  })();
})();
</script>
</body>
</html>
