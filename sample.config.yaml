# Matrix Room Media Gallery — sample configuration
# Copy this file to config.yaml and fill in your values before running.

# Matrix homeserver URL (no trailing slash)
homeserver: "https://matrix.example.com"

# Access token from your Matrix client (Settings → Help & About → Access Token)
access_token: "your_access_token_here"

# Secret used to sign media proxy URLs — prevents open-proxy abuse.
# Generate one with:  openssl rand -hex 32
media_secret: "change_me_to_a_random_secret"

# Optional: lock the gallery to a single room. When set, the room selector is
# hidden in the UI and only this room's media can be served. Leave empty (or
# omit) to allow browsing every joined room via the dropdown.
# room_id: "!roomid:matrix.example.com"
room_id: ""

# HTTP listen address and port
listen_address: "0.0.0.0"
listen_port: 8008

# Directory used to cache generated thumbnails
cache_dir: "./cache"
